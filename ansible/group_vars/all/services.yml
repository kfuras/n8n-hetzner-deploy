# User-managed service configuration
# Edit this file freely - OpenTofu will never overwrite it
# To add a new service, add an entry with enabled, compose_file, subdomain(s), and secrets

---
services:
  baserow:
    enabled: false
    compose_file: docker-compose.baserow.yml
    subdomain: baserow
    secrets:
      - REDIS_PASSWORD
      - DATABASE_PASSWORD
      - SECRET_KEY
  nocodb:
    enabled: false
    compose_file: docker-compose.nocodb.yml
    subdomain: nocodb
    secrets:
      - NOCODB_PASSWORD
  minio:
    enabled: false
    compose_file: docker-compose.minio.yml
    subdomains: [minio, minio-data]
    secrets:
      - MINIO_ROOT_PASSWORD
  postiz:
    enabled: false
    compose_file: docker-compose.postiz.yml
    subdomain: postiz
    secrets:
      - POSTIZ_DB_PASSWORD
      - POSTIZ_JWT_SECRET
  nca_toolkit:
    enabled: false
    compose_file: docker-compose.nca-toolkit.yml
    subdomain: nca-toolkit
    secrets:
      - NCA_API_KEY
      - NCA_S3_ACCESS_KEY
      - NCA_S3_SECRET_KEY
  kokoro_tts:
    enabled: false
    compose_file: docker-compose.kokoro-tts.yml
    subdomain: kokoro-tts
    secrets: []
